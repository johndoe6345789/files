name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    # Builds Drogon from source through Conan (about 10 minutes the first time, cached after) and runs util_test
    # inside the image build, then starts the whole stack and runs the API test against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait
      - name: API tests
        run: |
          docker run --rm --network files_default -v "$PWD/test:/t:ro" python:3.12-slim \
            python /t/api_test.py http://backend:8080 http://portal:8080
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
