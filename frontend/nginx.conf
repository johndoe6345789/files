# Front door of files.wardcrew.com: the React app, and /api proxied to the Drogon backend.
log_format files '$remote_addr xff="$http_x_forwarded_for" "$request" $status $body_bytes_sent';
access_log /dev/stdout files;

# Uploads are rate limited per visitor. Behind CapRover the connection comes from its proxy, so the visitor is named by
# X-Forwarded-For: each proxy appends the address it saw, so the chain ends "<visitor>, <last proxy>". The second-to-last
# entry is therefore the real visitor, and anything a visitor puts in front of it is ignored. Without the header
# (direct access) the connection's own address is used.
map $http_x_forwarded_for $visitor {
    "~([^,\s]+)\s*,\s*[^,\s]+\s*$" $1;
    default                          $remote_addr;
}
# $limit_key is empty for everything except POST, and an empty key is not limited.
map $request_method $limit_key {
    POST    $visitor;
    default "";
}
limit_req_zone $limit_key zone=uploads:10m rate=20r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;  # must match kMaxFileBytes in the backend
    client_body_timeout 300s;
    resolver 127.0.0.11 valid=10s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    location /api/ {
        # Reading and uploading only. DELETE exists in the backend but is not reachable from outside.
        limit_except GET HEAD POST { deny all; }
        limit_req zone=uploads burst=10 nodelay;

        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering off;   # stream uploads through instead of spooling 200 MB into /tmp
        proxy_buffering off;           # and downloads
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
